name: Download and commit APK990

on:
  workflow_dispatch:

jobs:
  download-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          mkdir -p apks
          wget -q -P apks/ \
            "https://github.com/iampedii/WhiteDNS/releases/download/1.1.0/WhiteDNS-1.1.0-arm64-v8a.apk"
            
            wget -q -P apks/ \
            "https://github.com/sartoopjj/thefeed/releases/download/v0.17.5/thefeed-android-v0.17.5-arm64-v8a.apk"
            
            
            wget -q -P apks/ \
            "https://github.com/therealaleph/MasterHttpRelayVPN-RUST/releases/download/v1.9.21/mhrv-rs-android-arm64-v8a-v1.9.21.apk"
            
            
            wget -q -P apks/ \
            "https://github.com/therealaleph/MasterHttpRelayVPN-RUST/releases/download/v1.9.21/mhrv-rs-windows-amd64.zip"
            
            
            wget -q -P apks/ \
            "https://github.com/MaxiFan/TunnelX/releases/download/v1.2.24/TunnelX-v1.2.24-standalone-compressed.exe"
            
            

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apks/*.* || true
          git diff --staged --quiet || git commit -m "Add mhrv-rs APK v1.7.9"
          git push
