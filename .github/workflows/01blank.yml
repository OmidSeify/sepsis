name: Download and commit APK9

on:
  workflow_dispatch:

jobs:
  download-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          mkdir -p apks
          wget -q -P apks/ \
            "https://github.com/sartoopjj/thefeed/releases/download/v0.17.4/thefeed-android-v0.17.4-arm64-v8a.apk"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apks/*.apk || true
          git diff --staged --quiet || git commit -m "Add mhrv-rs APK v1.7.9"
          git push
